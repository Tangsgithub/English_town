name: 零成本AI智能扫描处理 # 机器人换了免费、自主的大脑

# 触发条件：只有 images 文件夹下的图push变化，机器人才会苏醒
on:
  push:
    paths:
      - 'images/**' # 🚨 核心触发条件，根目录图不触发！

jobs:
  analyze_voxel_scene: 
    runs-on: ubuntu-latest # 配一台普通的电脑

    permissions:
      contents: write # 👑 极其重要：给机器人“写权”。否则 scenes.json 报错，网页一直卡！

    steps: # 机器人干活的具体步骤，无需密钥！
      - name: 第一步：拉取仓库最新代码
        uses: actions/checkout@v4

      - name: 第二步：配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-python-version: '3.9' # 配一个适合跑跑 AI 脚本的 Python

      - name: 第三步：安装开源 AI 工具箱 (Ultralytics YOLOv8)
        run: |
          pip install ultralytics # ✨ 核心魔法：只安装这一个完全免费的 AI 工具箱
          # 徹底告别 Google 和 GPT 收费 trap！

      - name: 第四步：加载免费大脑，运行扫描脚本
        run: |
          python scripts/analyze_vision.py # 运行脚本，扫描图片、计算坐标、更新 json

      - name: 第五步：把自动更新后的数据全自动推回仓库
        # 机器人 push 后，GitHub Pages 机器人会自动发布新版网站。成本: $0
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AIGC Voxel Robot (Free Brain)"
          git add scenes.json 
          git commit -m "🤖 自动AIGC处理: scene.json 已自动更新 [开源 YOLOv8 模型, $0 成本]" || echo "No changes to commit"
          git push
