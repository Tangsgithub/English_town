<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steve Voxel English Academy</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f8fafc;
            font-family: 'Comic Sans MS', 'PingFang SC', sans-serif; 
        }

        /* 👑 新增：顶部导航菜单的样式 */
        .nav-menu {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            background: white;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .scene-btn {
            background: transparent;
            border: 2px solid transparent;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #64748b;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        /* 当按钮被选中时的样式 */
        .scene-btn.active {
            background: #e0f2fe;
            color: #0284c7;
            border: 2px solid #38bdf8;
        }

        .instruction {
            margin: 15px;
            color: #0f172a;
            font-size: 18px;
            font-weight: bold;
        }

        .book-container {
            position: relative;
            width: 95vw;
            max-width: 1200px; 
            border: 10px solid #fff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        /* 👑 新增：场景大盒子，默认全部隐藏，只有带 active 的才显示 */
        .scene {
            display: none; 
            position: relative;
            width: 100%;
        }

        .scene.active {
            display: block; 
        }

        .page-image {
            width: 100%;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            background-color: transparent; /* 调试时可以改成 rgba(255,0,0,0.3) */
            border: none; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .word-label {
            white-space: nowrap; 
            background: rgba(255, 255, 255, 0.95); 
            color: #333;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); 
            pointer-events: none; 
            opacity: 0; 
            transform: translateY(15px); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            text-align: center;
        }

        .word-label.show {
            opacity: 1;
            transform: translateY(-10px); 
        }

        .phonetic {
            display: block;
            color: #e11d48; 
            font-size: 16px;
            margin-top: 4px;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <!-- 🌟 导航菜单 -->
    <div class="nav-menu">
        <button class="scene-btn active" onclick="switchScene('scene1', this)">🚜 魔法农场</button>
        <button class="scene-btn" onclick="switchScene('scene2', this)">🏫 体素教室</button>
    </div>

    <div class="instruction">🪄 找一找画面里的动植物，点一下试试看！</div>

    <!-- 🌟 装所有场景的大画框 -->
    <div class="book-container">
        
        <!-- ================= 场景 1：魔法农场 ================= -->
        <div id="scene1" class="scene active">
            <!-- 这里放你刚搞定的农场图 -->
            <img src="magic_farm.png" class="page-image" alt="Magic Farm">

            <!-- 农场的热点框 -->
            <div class="hotspot" style="top: 15%; left: 5%; width: 15%; height: 30%;" onclick="speak('Apple Tree', this)">
                <span class="word-label">Apple Tree<span class="phonetic">[ˈæpl triː]</span></span>
            </div>
            <div class="hotspot" style="top: 35%; left: 35%; width: 25%; height: 30%;" onclick="speak('House', this)">
                <span class="word-label">House<span class="phonetic">[haʊs]</span></span>
            </div>
        </div>

        <!-- ================= 场景 2：体素教室（等待你上传新图） ================= -->
        <div id="scene2" class="scene">
            <!-- 假设你之后会上传一张叫 voxel-classroom.jpg 的图片 -->
            <img src="voxel-classroom.png" class="page-image" alt="Voxel Classroom" onerror="this.src='https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&q=80&w=1000'">

            <!-- 教室的热点框 (你需要根据新图重新调百分比) -->
            <div class="hotspot" style="top: 40%; left: 20%; width: 20%; height: 30%;" onclick="speak('Desk', this)">
                <span class="word-label">Desk<span class="phonetic">[desk]</span></span>
            </div>
            <div class="hotspot" style="top: 20%; left: 60%; width: 25%; height: 40%;" onclick="speak('Blackboard', this)">
                <span class="word-label">Blackboard<span class="phonetic">[ˈblækbɔːrd]</span></span>
            </div>
        </div>

    </div>

    <script>
        // 核心功能 1：发声和动画
        function speak(text, element) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; 
            utterance.rate = 0.85;    
            utterance.pitch = 1.1;    
            window.speechSynthesis.speak(utterance);

            const label = element.querySelector('.word-label');
            label.classList.add('show');
            setTimeout(() => { label.classList.remove('show'); }, 2000);
        }

        // 核心功能 2：切换场景的魔法逻辑
        function switchScene(sceneId, clickedBtn) {
            // 第一步：把所有的场景都藏起来
            const allScenes = document.querySelectorAll('.scene');
            allScenes.forEach(scene => {
                scene.classList.remove('active');
            });

            // 第二步：把目标场景显示出来
            const targetScene = document.getElementById(sceneId);
            targetScene.classList.add('active');

            // 第三步：更新顶部按钮的颜色（让选中的按钮变蓝）
            const allBtns = document.querySelectorAll('.scene-btn');
            allBtns.forEach(btn => {
                btn.classList.remove('active');
            });
            clickedBtn.classList.add('active');
        }
    </script>
</body>
</html>
