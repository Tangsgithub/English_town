<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的第一个英语 AR 魔法网页</title>
    <!-- 引入强大的 3D 和 AR 库（也就是借用别人的现成工具） -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">
    <!-- 构建一个 AR 场景 -->
    <a-scene embedded arjs>
        <!-- 定义一个识别图（名字叫 hiro） -->
        <a-marker preset="hiro">
            <!-- 当手机看到识别图时，在图片上方悬浮一个红色的 3D 方块 -->
            <!-- 以后你可以把这个方块换成你设计的 3D 角色！ -->
            <a-box position="0 0.5 0" material="color: red; opacity: 0.8;" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
        </a-marker>
        <!-- 开启手机摄像头 -->
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
