<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>史蒂夫体素英语学院 - 0成本AIGC自动教学平台</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; align-items: center; background-color: #f8fafc; font-family: 'Comic Sans MS', 'PingFang SC', sans-serif; padding-bottom: 50px;}
        .nav-menu { margin-top: 20px; display: flex; gap: 15px; background: white; padding: 10px 20px; border-radius: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .scene-btn { background: transparent; border: 2px solid transparent; padding: 10px 20px; font-size: 18px; font-weight: bold; color: #64748b; border-radius: 20px; cursor: pointer; transition: all 0.3s; }
        .scene-btn.active { background: #e0f2fe; color: #0284c7; border: 2px solid #38bdf8; }
        .instruction { margin: 15px; color: #0f172a; font-size: 20px; font-weight: bold; text-align: center;}
        .book-container { position: relative; width: 98vw; max-width: 1400px; border: 12px solid #fff; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); overflow: hidden; }
        .page-image { width: 100%; display: block; user-select: none; -webkit-user-drag: none; }
        .hotspot { position: absolute; cursor: pointer; background-color: transparent; border: none; display: flex; align-items: center; justify-content: center; z-index: 5;}
        .word-label { white-space: nowrap; background: rgba(255, 255, 255, 0.96); color: #333; padding: 12px 20px; border-radius: 15px; font-size: 24px; font-weight: bold; box-shadow: 0 10px 25px rgba(0,0,0,0.2); pointer-events: none; opacity: 0; transform: translateY(15px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center; }
        .word-label.show { opacity: 1; transform: translateY(-10px); }
        .phonetic { display: block; color: #e11d48; font-size: 16px; margin-top: 4px; font-weight: normal; font-family: sans-serif;}
    </style>
</head>
<body>
    <div id="nav-menu" class="nav-menu"></div>
    <div id="instruction" class="instruction">🪄 正在请求 AI 扫描的魔法数据...</div>
    <div class="book-container">
        <img id="page-image" src="" class="page-image" alt="Voxel English Scene">
        <div id="hotspot-container"></div>
    </div>
    <script>
        let appData = null;
        function loadScene(sceneId) {
            if (!appData || !appData.scenes[sceneId]) {
                console.error("💡 AIGC数据未就绪。请确认在 images/ 下传了图且机器人跑完 ✅。");
                return;
            }
            const sceneData = appData.scenes[sceneId];
            const allBtns = document.querySelectorAll('.scene-btn');
            allBtns.forEach(btn => btn.classList.remove('active'));
            const clickedBtn = document.querySelector(`[onclick*="loadScene('${sceneId}')"]`);
            if (clickedBtn) clickedBtn.classList.add('active');
            document.getElementById('instruction').innerText = sceneData.instruction;
            document.getElementById('page-image').src = sceneData.imageUrl;
            const hotspotContainer = document.getElementById('hotspot-container');
            hotspotContainer.innerHTML = '';
            sceneData.hotspots.forEach(hs => {
                const hsElement = document.createElement('div');
                hsElement.className = 'hotspot';
                hsElement.style.cssText = `top: ${hs.top}%; left: ${hs.left}%; width: ${hs.width}%; height: ${hs.height}%;`;
                hsElement.innerHTML = `<span class="word-label">${hs.word}<span class="phonetic">${hs.phonetic}</span></span>`;
                hsElement.onclick = () => speak(hs.word, hsElement);
                hotspotContainer.appendChild(hsElement);
            });
        }
        function speak(text, element) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; utterance.rate = 0.85; utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
            const label = element.querySelector('.word-label');
            label.classList.add('show');
            setTimeout(() => { label.classList.remove('show'); }, 2000);
        }
        window.onload = function() {
            fetch('scenes.json')
                .then(response => {
                    if (!response.ok) throw new Error("无法读取场景数据文件 (scenes.json)");
                    return response.json();
                }) 
                .then(data => {
                    appData = data;
                    const navMenu = document.getElementById('nav-menu');
                    Object.values(appData.scenes).forEach(s => {
                        const btn = document.createElement('button');
                        btn.className = 'scene-btn';
                        btn.innerText = s.title;
                        btn.onclick = () => loadScene(s.id);
                        navMenu.appendChild(btn);
                    });
                    loadScene(appData.activeScene);
                })
                .catch(error => {
                    console.error("💡 AIGC初始化出错:", error);
                    document.getElementById('instruction').innerHTML = "⚠️ 数据未就绪。请确认在 `images/` 下传了图且 GitHub Actions 绿勾✅。";
                });
        }
    </script>
</body>
</html>
